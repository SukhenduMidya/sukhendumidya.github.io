<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OOPS Lab Manual</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e293b);
        }

        .container{
            background:#334155;
            padding:50px;
            border-radius:25px;
            text-align:center;
            color:white;
            width:400px;
            box-shadow:0 10px 30px rgba(0,0,0,0.4);
        }

        h1{
            font-size:42px;
            margin-bottom:20px;
        }

        p{
            color:#cbd5e1;
            margin-bottom:35px;
            font-size:18px;
        }

        .btn{
            display:inline-block;
            text-decoration:none;
            background:#06b6d4;
            color:black;
            padding:16px 30px;
            border-radius:15px;
            font-size:20px;
            font-weight:bold;
            transition:0.3s;
        }

        .btn:hover{
            background:#22d3ee;
            transform:scale(1.05);
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>💻 OOPS Manual</h1>

        <p>
            Click below to download the PDF manual
        </p>

        <a href="../../uploads/oops_manual.pdf" class="btn" download>

            Download PDF

        </a>

    </div>

</body>

</html>
