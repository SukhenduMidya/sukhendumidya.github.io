<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Lab Repo</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#5b7cfa,#7c4dff);
            padding:20px;
        }

        .container{
            width:100%;
            max-width:900px;
            background:#f5f5f5;
            border-radius:30px;
            padding:50px;
            box-shadow:0 20px 50px rgba(0,0,0,0.3);
            text-align:center;
        }

        h1{
            font-size:55px;
            color:#222;
            margin-bottom:10px;
        }

        .subtitle{
            color:#555;
            font-size:20px;
            margin-bottom:50px;
        }

        .cards{
            display:flex;
            justify-content:center;
        }

        .card{
            text-decoration:none;
            color:white;
            width:260px;
            padding:40px 20px;
            border-radius:25px;
            background:linear-gradient(135deg,#ff9a9e,#f6416c);
            transition:0.3s;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .card:hover{
            transform:translateY(-8px) scale(1.03);
        }

        .icon{
            font-size:60px;
            margin-bottom:20px;
        }

        .card h2{
            font-size:38px;
            margin-bottom:10px;
        }

        .card p{
            font-size:18px;
            opacity:0.9;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🚀 College Lab Repo</h1>

        <p class="subtitle">
            Access all lab manuals in one place
        </p>

        <div class="cards">

            <a href="oops.html" class="card">

                <div class="icon">💻</div>

                <h2>OOPS</h2>

                <p>Object Oriented Programming</p>

            </a>

        </div>

    </div>

</body>

</html>
