<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Lab Repo</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg,#5b7cfa,#7c4dff);
            padding: 20px;
        }

        .container{
            width: 100%;
            max-width: 1000px;
            background: #f5f5f5;
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .title{
            text-align: center;
            margin-bottom: 40px;
        }

        .title h1{
            font-size: 55px;
            color: #222;
            margin-bottom: 10px;
        }

        .title p{
            color: #555;
            font-size: 20px;
        }

        .cards{
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .card{
            text-decoration: none;
            color: white;
            padding: 40px 20px;
            border-radius: 25px;
            text-align: center;
            transition: 0.3s;
        }

        .card:hover{
            transform: translateY(-8px) scale(1.03);
        }

        .card h2{
            font-size: 35px;
            margin: 15px 0;
        }

        .card p{
            font-size: 18px;
            opacity: 0.9;
        }

        .oops{
            background: linear-gradient(135deg,#ff9a9e,#f6416c);
        }

        .java{
            background: linear-gradient(135deg,#74ebd5,#009efd);
        }

        .python{
            background: linear-gradient(135deg,#43e97b,#38f9d7);
        }

        .icon{
            font-size: 55px;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="title">
            <h1>🚀 College Lab Repo</h1>
            <p>Access all lab manuals in one place</p>
        </div>

        <div class="cards">

            <a href="oops.html" class="card oops">
                <div class="icon">💻</div>
                <h2>OOPS</h2>
                <p>Object Oriented Programming</p>
            </a>

            <a href="java.html" class="card java">
                <div class="icon">☕</div>
                <h2>JAVA</h2>
                <p>Java Programming Lab</p>
            </a>

            <a href="python.html" class="card python">
                <div class="icon">🐍</div>
                <h2>PYTHON</h2>
                <p>Python Programming Lab</p>
            </a>

        </div>

    </div>

</body>

</html>
